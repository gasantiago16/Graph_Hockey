<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Graph_Hockey · Film Room</title>
  <style>
    :root {
      --bg: #070b12;
      --panel: #101826;
      --line: #1e2c40;
      --text: #e8eef4;
      --muted: #8aa0b5;
      --gold: #d4a017;
      --home: #c8102e;
      --away: #2e6da4;
      --ice: #d9e7f0;
      --ice-line: #8aa4b8;
      --ok: #3ecf8e;
      --bad: #e85d5d;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.4 "Segoe UI", system-ui, sans-serif; }
    header {
      display: flex; align-items: center; gap: 16px; padding: 12px 20px;
      border-bottom: 1px solid var(--line); background: #0c1320;
    }
    header h1 { font-size: 15px; font-weight: 650; margin: 0; letter-spacing: .04em; }
    header h1 span { color: var(--gold); }
    .sub { color: var(--muted); font-size: 12px; }
    .nav a { color: var(--muted); text-decoration: none; margin-left: 14px; }
    .nav a:hover, .nav a.on { color: var(--gold); }
    .layout { display: grid; grid-template-columns: 1fr 320px; grid-template-rows: auto auto 1fr; gap: 0; height: calc(100% - 54px); }
    .toolbar { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); }
    .toolbar button, .chip {
      background: var(--panel); color: var(--text); border: 1px solid var(--line);
      border-radius: 4px; padding: 6px 10px; cursor: pointer; font: inherit;
    }
    .toolbar button:hover, .chip:hover { border-color: var(--gold); }
    .chip.on { background: #1c2a22; border-color: var(--ok); color: var(--ok); }
    .chip.pair { border-color: var(--gold); color: var(--gold); }
    .stage { padding: 12px 16px 8px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
    .rinks { display: flex; gap: 12px; }
    .rink-wrap { flex: 1; min-width: 0; }
    .rink-wrap h2 { margin: 0 0 6px; font-size: 12px; color: var(--muted); font-weight: 600; }
    canvas.rink { width: 100%; background: #0a1820; border-radius: 6px; border: 1px solid var(--line); display: block; }
    .controls { display: flex; align-items: center; gap: 8px; }
    .controls input[type=range] { flex: 1; }
    .side {
      border-left: 1px solid var(--line); background: #0c1320; overflow: auto; padding: 12px;
    }
    .side h3 { margin: 0 0 8px; font-size: 11px; letter-spacing: .12em; color: var(--gold); text-transform: uppercase; }
    .clip {
      border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; margin-bottom: 8px; cursor: pointer;
    }
    .clip:hover { border-color: #3a5473; }
    .clip.on { border-color: var(--gold); background: #17120a; }
    .clip .k { font-size: 10px; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
    .clip .t { font-weight: 600; margin: 2px 0; }
    .clip .n { font-size: 12px; color: var(--muted); }
    .board { grid-column: 1 / -1; border-top: 1px solid var(--line); padding: 12px 16px 16px; background: #0c1320; overflow: auto; max-height: 280px; }
    .board-grid { display: grid; grid-template-columns: 280px 1fr 1fr; gap: 16px; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 600; }
    .up { color: var(--ok); }
    .down { color: var(--bad); }
    .pairs button { width: 100%; text-align: left; margin-bottom: 6px; }
    kbd { background: #1a2433; border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; font-size: 11px; color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <h1>GRAPH_<span>HOCKEY</span> · FILM ROOM</h1>
    <div class="sub">Review footage · record improvement · AAR on ice</div>
    <nav class="nav" style="margin-left:auto">
      <a href="/">Live rink</a>
      <a class="on" href="/film">Film Room</a>
    </nav>
  </header>
  <div class="layout">
    <div class="toolbar" id="toolbar"></div>
    <div class="stage">
      <div class="rinks" id="rinks"></div>
      <div class="controls">
        <button id="btnPlay" type="button">Play</button>
        <button id="btnBack" type="button">−1s</button>
        <button id="btnFwd" type="button">+1s</button>
        <input id="scrub" type="range" min="0" max="1000" value="0" />
        <span id="clock">0.0s</span>
        <select id="speed">
          <option value="0.25">0.25×</option>
          <option value="0.5">0.5×</option>
          <option value="1" selected>1×</option>
          <option value="2">2×</option>
        </select>
        <span class="sub"><kbd>Space</kbd> <kbd>J</kbd><kbd>K</kbd> <kbd>1–4</kbd></span>
      </div>
    </div>
    <aside class="side">
      <h3>Clips</h3>
      <div id="clipList"></div>
      <h3 style="margin-top:16px">This moment</h3>
      <p id="note" class="sub">Pick a clip. AAR citations land on the ice, not in a paragraph.</p>
    </aside>
    <section class="board">
      <div class="board-grid">
        <div>
          <h3 style="margin:0 0 8px;font-size:11px;letter-spacing:.12em;color:var(--gold);text-transform:uppercase">Improvement ledger</h3>
          <div id="deltas"></div>
          <canvas id="chart" width="280" height="120"></canvas>
        </div>
        <div>
          <h3 style="margin:0 0 8px;font-size:11px;letter-spacing:.12em;color:var(--gold);text-transform:uppercase">Series (home = Original Six)</h3>
          <div id="table"></div>
        </div>
        <div>
          <h3 style="margin:0 0 8px;font-size:11px;letter-spacing:.12em;color:var(--gold);text-transform:uppercase">Paired film (same play, later)</h3>
          <div id="pairs" class="pairs"></div>
        </div>
      </div>
    </section>
  </div>
  <script type="module">
    const ICE = { w: 200, h: 85, gl: 89 };

    const HOME = [
      { id: "HG", n: 31, pos: "G" }, { id: "HLD", n: 4, pos: "LD" }, { id: "HRD", n: 5, pos: "RD" },
      { id: "HC", n: 9, pos: "C" }, { id: "HLW", n: 17, pos: "LW" }, { id: "HRW", n: 28, pos: "RW" },
    ];
    const AWAY = [
      { id: "AG", n: 1, pos: "G" }, { id: "ALD", n: 8, pos: "LD" }, { id: "ARD", n: 44, pos: "RD" },
      { id: "AC", n: 13, pos: "C" }, { id: "ALW", n: 19, pos: "LW" }, { id: "ARW", n: 81, pos: "RW" },
    ];

    function lerp(a, b, t) { return a + (b - a) * t; }
    function lerp2(a, b, t) { return { x: lerp(a.x, b.x, t), y: lerp(a.y, b.y, t) }; }
    function clamp01(t) { return Math.max(0, Math.min(1, t)); }

    function baseIces() {
      return {
        HG: { x: -89, y: 0 }, HLD: { x: -52, y: 16 }, HRD: { x: -52, y: -16 },
        HC: { x: -18, y: 0 }, HLW: { x: -12, y: 24 }, HRW: { x: -12, y: -24 },
        AG: { x: 89, y: 0 }, ALD: { x: 52, y: -16 }, ARD: { x: 52, y: 16 },
        AC: { x: 18, y: 0 }, ALW: { x: 12, y: -24 }, ARW: { x: 12, y: 24 },
        puck: { x: 0, y: 0 },
      };
    }

    function apply(map, id, p) { map[id] = p; }

    const scenarios = {
      crashNetGoalAgainst(u) {
        const m = baseIces();
        const t = clamp01(u);
        apply(m, "ARW", lerp2({ x: 8, y: -22 }, { x: -62, y: -12 }, Math.min(1, t / 0.45)));
        apply(m, "AC", lerp2({ x: 12, y: 2 }, { x: -70, y: 2 }, Math.min(1, t / 0.5)));
        apply(m, "ALW", lerp2({ x: 10, y: 20 }, { x: -48, y: 22 }, Math.min(1, t / 0.5)));
        apply(m, "HLD", lerp2({ x: -55, y: 18 }, { x: -72, y: 10 }, Math.max(0, (t - 0.4) / 0.4)));
        apply(m, "HRD", lerp2({ x: -55, y: -18 }, { x: -70, y: -8 }, Math.max(0, (t - 0.55) / 0.3)));
        const puckA = { x: 8, y: -20 };
        const puckB = { x: -62, y: -10 };
        const puckC = { x: -70, y: 1 };
        const puckD = { x: -93, y: 0 };
        if (t < 0.45) m.puck = lerp2(puckA, puckB, t / 0.45);
        else if (t < 0.7) m.puck = lerp2(puckB, puckC, (t - 0.45) / 0.25);
        else m.puck = lerp2(puckC, puckD, (t - 0.7) / 0.3);
        apply(m, "HG", { x: -88, y: lerp(0, m.puck.y * 0.3, t) });
        return m;
      },
      boxOutSave(u) {
        const m = baseIces();
        const t = clamp01(u);
        apply(m, "ARW", lerp2({ x: 8, y: -22 }, { x: -60, y: -12 }, Math.min(1, t / 0.45)));
        apply(m, "AC", lerp2({ x: 12, y: 2 }, { x: -68, y: 2 }, Math.min(1, t / 0.5)));
        apply(m, "HLD", lerp2({ x: -52, y: 16 }, { x: -66, y: 6 }, Math.min(1, t / 0.4)));
        apply(m, "HRD", lerp2({ x: -52, y: -16 }, { x: -64, y: -2 }, Math.min(1, t / 0.35)));
        const puckA = { x: 8, y: -20 };
        const puckB = { x: -58, y: -8 };
        const puckC = { x: -78, y: 2 };
        const puckD = { x: -70, y: 28 };
        const puckE = { x: 10, y: 10 };
        if (t < 0.4) m.puck = lerp2(puckA, puckB, t / 0.4);
        else if (t < 0.62) m.puck = lerp2(puckB, puckC, (t - 0.4) / 0.22);
        else if (t < 0.75) m.puck = lerp2(puckC, puckD, (t - 0.62) / 0.13);
        else m.puck = lerp2(puckD, puckE, (t - 0.75) / 0.25);
        apply(m, "HG", { x: -88, y: lerp(0, 4, Math.min(1, t)) });
        apply(m, "HLD", t > 0.75 ? lerp2(m.HLD, { x: -20, y: 18 }, (t - 0.75) / 0.25) : m.HLD);
        return m;
      },
      cycleTurnover(u) {
        const m = baseIces();
        const t = clamp01(u);
        apply(m, "HRW", lerp2({ x: -10, y: -20 }, { x: 62, y: -28 }, Math.min(1, t / 0.4)));
        apply(m, "HC", lerp2({ x: -8, y: 0 }, { x: 55, y: -8 }, Math.min(1, t / 0.45)));
        apply(m, "HLW", lerp2({ x: -8, y: 22 }, { x: 70, y: 22 }, Math.min(1, t / 0.5)));
        apply(m, "ARD", lerp2({ x: 52, y: 16 }, { x: 58, y: 4 }, t));
        const a = { x: 20, y: -10 }, b = { x: 68, y: -30 }, c = { x: 72, y: 18 }, d = { x: 40, y: 8 }, e = { x: -30, y: 6 };
        if (t < 0.35) m.puck = lerp2(a, b, t / 0.35);
        else if (t < 0.55) m.puck = lerp2(b, c, (t - 0.35) / 0.2);
        else if (t < 0.7) m.puck = lerp2(c, d, (t - 0.55) / 0.15);
        else m.puck = lerp2(d, e, (t - 0.7) / 0.3);
        return m;
      },
      cycleGoal(u) {
        const m = baseIces();
        const t = clamp01(u);
        apply(m, "HRW", lerp2({ x: -10, y: -20 }, { x: 64, y: -26 }, Math.min(1, t / 0.4)));
        apply(m, "HC", lerp2({ x: -8, y: 0 }, { x: 72, y: 2 }, Math.min(1, t / 0.5)));
        apply(m, "HLW", lerp2({ x: -8, y: 22 }, { x: 58, y: 12 }, Math.min(1, t / 0.45)));
        apply(m, "HLD", lerp2({ x: -40, y: 16 }, { x: 35, y: 22 }, t));
        const a = { x: 18, y: -8 }, b = { x: 70, y: -28 }, c = { x: 68, y: 8 }, d = { x: 82, y: 3 }, e = { x: 94, y: 1 };
        if (t < 0.35) m.puck = lerp2(a, b, t / 0.35);
        else if (t < 0.6) m.puck = lerp2(b, c, (t - 0.35) / 0.25);
        else if (t < 0.78) m.puck = lerp2(c, d, (t - 0.6) / 0.18);
        else m.puck = lerp2(d, e, (t - 0.78) / 0.22);
        apply(m, "AG", { x: 88, y: lerp(0, -6, Math.min(1, t * 1.2)) });
        return m;
      },
    };

    function worldTo(c, x, y) {
      const pad = 18;
      const iceW = c.width - pad * 2;
      const iceH = c.height - pad * 2;
      return {
        x: pad + ((x + 100) / 200) * iceW,
        y: pad + ((42.5 - y) / 85) * iceH,
      };
    }

    function drawRink(ctx, frame, label) {
      const { width: W, height: H } = ctx.canvas;
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = "#123044";
      ctx.fillRect(0, 0, W, H);
      const tl = worldTo(ctx, -100, 42.5);
      const br = worldTo(ctx, 100, -42.5);
      const rw = br.x - tl.x, rh = br.y - tl.y;
      ctx.fillStyle = "#d9e7f0";
      roundRect(ctx, tl.x, tl.y, rw, rh, 28 * (rw / 200));
      ctx.fill();
      ctx.strokeStyle = "#8aa4b8";
      ctx.lineWidth = 2;
      ctx.stroke();
      const line = (x0, y0, x1, y1, color, w = 1.5) => {
        const a = worldTo(ctx, x0, y0), b = worldTo(ctx, x1, y1);
        ctx.strokeStyle = color; ctx.lineWidth = w;
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      };
      line(0, 42.5, 0, -42.5, "#c8102e", 2);
      line(-25, 42.5, -25, -42.5, "#2e6da4", 2);
      line(25, 42.5, 25, -42.5, "#2e6da4", 2);
      line(-89, 22, -89, -22, "#c8102e", 1);
      line(89, 22, 89, -22, "#c8102e", 1);
      for (const gx of [-89, 89]) {
        const g0 = worldTo(ctx, gx, 3), g1 = worldTo(ctx, gx + Math.sign(gx) * 2, -3);
        ctx.strokeStyle = "#111"; ctx.lineWidth = 3;
        ctx.strokeRect(Math.min(g0.x, g1.x), Math.min(g0.y, g1.y), Math.abs(g1.x - g0.x), Math.abs(g1.y - g0.y));
      }
      const dots = [[0, 0], [-69, 22], [-69, -22], [69, 22], [69, -22], [-20, 22], [-20, -22], [20, 22], [20, -22]];
      ctx.fillStyle = "#c8102e";
      for (const [x, y] of dots) {
        const p = worldTo(ctx, x, y);
        ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI * 2); ctx.fill();
      }
      if (!frame) return;
      const drawP = (id, side) => {
        const p = frame[id]; if (!p) return;
        const c = worldTo(ctx, p.x, p.y);
        const roster = side === "home" ? HOME : AWAY;
        const rec = roster.find((r) => r.id === id);
        ctx.fillStyle = side === "home" ? "#c8102e" : "#1d4e89";
        ctx.beginPath(); ctx.arc(c.x, c.y, rec.pos === "G" ? 8 : 7, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#fff"; ctx.font = "8px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(String(rec.n), c.x, c.y);
      };
      for (const p of HOME) drawP(p.id, "home");
      for (const p of AWAY) drawP(p.id, "away");
      const pk = worldTo(ctx, frame.puck.x, frame.puck.y);
      ctx.fillStyle = "#111"; ctx.beginPath(); ctx.arc(pk.x, pk.y, 4, 0, Math.PI * 2); ctx.fill();
      if (label) {
        ctx.fillStyle = "rgba(7,11,18,.72)";
        ctx.fillRect(10, 8, 220, 22);
        ctx.fillStyle = "#e8eef4"; ctx.font = "12px sans-serif"; ctx.textAlign = "left";
        ctx.fillText(label, 16, 23);
      }
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    const data = await fetch("/fixtures/film/demo-series.json").then((r) => r.json());

    const state = {
      mode: "single",
      clip: data.clips[0],
      compare: null,
      playing: false,
      u: 0,
      last: performance.now(),
    };

    const canvases = [];
    function sizeCanvas(cv) {
      const rect = cv.getBoundingClientRect();
      cv.width = Math.max(320, Math.floor(rect.width * devicePixelRatio));
      cv.height = Math.floor(cv.width * (85 / 200) * 0.92);
    }

    function renderRinkSlots() {
      const el = document.getElementById("rinks");
      el.innerHTML = "";
      canvases.length = 0;
      const slots = state.mode === "compare"
        ? [
            { clip: state.compare.early, label: "Game 1 · before AAR" },
            { clip: state.compare.late, label: "Game 7 · after AAR" },
          ]
        : [{ clip: state.clip, label: state.clip.title }];
      for (const s of slots) {
        const wrap = document.createElement("div");
        wrap.className = "rink-wrap";
        wrap.innerHTML = `<h2>${s.label}</h2>`;
        const cv = document.createElement("canvas");
        cv.className = "rink";
        wrap.appendChild(cv);
        el.appendChild(wrap);
        canvases.push({ cv, clip: s.clip, label: s.label });
      }
      requestAnimationFrame(() => {
        for (const { cv, clip, label } of canvases) {
          sizeCanvas(cv);
          const fn = scenarios[clip.scenario];
          drawRink(cv.getContext("2d"), fn(state.u), clip.title);
        }
      });
    }

    function clipDuration(clip) {
      return Math.max(0.5, (clip.endLiveTick - clip.startLiveTick) * 0.1);
    }

    function tick(now) {
      const dt = (now - state.last) / 1000;
      state.last = now;
      if (state.playing) {
        const spd = Number(document.getElementById("speed").value);
        const dur = clipDuration(state.mode === "compare" ? state.compare.early : state.clip);
        state.u = Math.min(1, state.u + (dt * spd) / dur);
        if (state.u >= 1) state.playing = false;
      }
      document.getElementById("btnPlay").textContent = state.playing ? "Pause" : "Play";
      document.getElementById("scrub").value = String(Math.round(state.u * 1000));
      const dur = clipDuration(state.mode === "compare" ? state.compare.early : state.clip);
      document.getElementById("clock").textContent = `${(state.u * dur).toFixed(1)}s`;
      for (const { cv, clip } of canvases) {
        const fn = scenarios[clip.scenario];
        if (!fn) continue;
        drawRink(cv.getContext("2d"), fn(state.u), clip.title);
      }
      requestAnimationFrame(tick);
    }

    function selectClip(clip, extraNote) {
      state.mode = "single";
      state.clip = clip;
      state.compare = null;
      state.u = 0;
      state.playing = true;
      document.getElementById("note").textContent = extraNote || clip.note || "";
      renderRinkSlots();
      [...document.querySelectorAll(".clip")].forEach((n) => n.classList.toggle("on", n.dataset.id === clip.id));
    }

    function playPair(earlyId, lateId) {
      const early = data.clips.find((c) => c.id === earlyId);
      const late = data.clips.find((c) => c.id === lateId);
      state.mode = "compare";
      state.compare = { early, late };
      state.clip = late;
      state.u = 0;
      state.playing = true;
      document.getElementById("note").textContent =
        `Same signature. ${early.title} vs ${late.title}. ${late.note}`;
      renderRinkSlots();
    }

    function renderClips() {
      const host = document.getElementById("clipList");
      host.innerHTML = data.clips.map((c) => `
        <div class="clip ${c.id === state.clip.id ? "on" : ""}" data-id="${c.id}">
          <div class="k">${c.kind} · ${c.playId} · ${c.source}</div>
          <div class="t">${c.title}</div>
          <div class="n">${c.note}</div>
        </div>`).join("");
      host.querySelectorAll(".clip").forEach((n) => n.onclick = () => {
        selectClip(data.clips.find((c) => c.id === n.dataset.id));
      });
    }

    function renderToolbar() {
      const tb = document.getElementById("toolbar");
      tb.innerHTML = `<span class="sub">${data.home.name} vs ${data.away.name} · 7-game series</span>`;
      for (const g of data.games) {
        const b = document.createElement("button");
        b.className = "chip";
        b.textContent = `G${g.gameIndex + 1} ${g.score.home}–${g.score.away}`;
        b.onclick = () => {
          const clip = data.clips.find((c) => c.gameIndex === g.gameIndex) || data.clips[0];
          selectClip(clip, g.aarSummary ? g.aarSummary.home : clip.note);
        };
        tb.appendChild(b);
      }
      const cmp = document.createElement("button");
      cmp.className = "chip pair";
      cmp.textContent = "Compare G1 vs G7 (DZ crash)";
      cmp.onclick = () => playPair("demo-g0:clip:0", "demo-g6:clip:0");
      tb.appendChild(cmp);
      const cmp2 = document.createElement("button");
      cmp2.className = "chip pair";
      cmp2.textContent = "Compare G1 vs G7 (OZ cycle)";
      cmp2.onclick = () => playPair("demo-g0:clip:1", "demo-g6:clip:1");
      tb.appendChild(cmp2);
    }

    function sign(n, invert = false) {
      const v = invert ? -n : n;
      const cls = v > 0.0001 ? "up" : v < -0.0001 ? "down" : "";
      const s = n > 0 ? `+${n}` : `${n}`;
      return `<span class="${cls}">${s}</span>`;
    }

    function renderBoard() {
      const g0 = data.games[0], g6 = data.games[6];
      const h0 = g0.aggregates.home, h6 = g6.aggregates.home;
      document.getElementById("deltas").innerHTML = `
        <p style="margin:0 0 8px"><b>Original Six · game 1 → 7</b></p>
        <div>xG for ${sign(+(h6.xgFor - h0.xgFor).toFixed(1))}</div>
        <div>xG against ${sign(+(h6.xgAgainst - h0.xgAgainst).toFixed(1), true)}</div>
        <div>Goals ${sign(h6.goalsFor - h0.goalsFor)} / ${sign(h6.goalsAgainst - h0.goalsAgainst, true)}</div>
        <div>CF% ${sign(h6.cfPct - h0.cfPct)}</div>
        <div>Playbook v${g0.playbookVersion.home} → v${g6.playbookVersion.home}</div>
      `;
      document.getElementById("table").innerHTML = `
        <table>
          <tr><th>G</th><th>Score</th><th>xGF</th><th>xGA</th><th>CF%</th><th>PB</th><th></th></tr>
          ${data.games.map((g) => {
            const h = g.aggregates.home;
            return `<tr>
              <td>${g.gameIndex + 1}</td>
              <td>${g.score.home}–${g.score.away}</td>
              <td>${h.xgFor.toFixed(1)}</td>
              <td>${h.xgAgainst.toFixed(1)}</td>
              <td>${h.cfPct}</td>
              <td>v${g.playbookVersion.home}</td>
              <td>${g.result.home}</td>
            </tr>`;
          }).join("")}
        </table>`;
      document.getElementById("pairs").innerHTML = `
        <button class="chip pair" type="button" id="p1">dz-collapse · DZ<br><small>G1 Goal against → G7 Save</small></button>
        <button class="chip pair" type="button" id="p2">oz-cycle-low · OZ<br><small>G1 Turnover → G7 Goal</small></button>
        <p class="sub">${data.story}</p>`;
      document.getElementById("p1").onclick = () => playPair("demo-g0:clip:0", "demo-g6:clip:0");
      document.getElementById("p2").onclick = () => playPair("demo-g0:clip:1", "demo-g6:clip:1");

      const cv = document.getElementById("chart");
      const ctx = cv.getContext("2d");
      ctx.clearRect(0, 0, cv.width, cv.height);
      const xs = data.games.map((_, i) => 20 + i * 38);
      const plot = (key, color) => {
        ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.beginPath();
        data.games.forEach((g, i) => {
          const y = 100 - g.aggregates.home[key] * 18;
          if (i === 0) ctx.moveTo(xs[i], y); else ctx.lineTo(xs[i], y);
        });
        ctx.stroke();
      };
      plot("xgFor", "#3ecf8e");
      plot("xgAgainst", "#e85d5d");
      ctx.fillStyle = "#8aa0b5"; ctx.font = "10px sans-serif";
      ctx.fillText("xGF", 8, 14); ctx.fillStyle = "#e85d5d"; ctx.fillText("xGA", 40, 14);
    }

    document.getElementById("btnPlay").onclick = () => { state.playing = !state.playing; if (state.u >= 1) { state.u = 0; state.playing = true; } };
    document.getElementById("btnBack").onclick = () => { state.u = Math.max(0, state.u - 0.15); };
    document.getElementById("btnFwd").onclick = () => { state.u = Math.min(1, state.u + 0.15); };
    document.getElementById("scrub").oninput = (e) => { state.u = Number(e.target.value) / 1000; };
    window.addEventListener("keydown", (e) => {
      if (e.code === "Space") { e.preventDefault(); document.getElementById("btnPlay").click(); }
      if (e.key === "j" || e.key === "J") document.getElementById("btnBack").click();
      if (e.key === "k" || e.key === "K") document.getElementById("btnFwd").click();
      if (["1", "2", "3", "4"].includes(e.key)) {
        document.getElementById("speed").value = { 1: "0.25", 2: "0.5", 3: "1", 4: "2" }[e.key];
      }
    });

    renderToolbar();
    renderClips();
    renderBoard();
    renderRinkSlots();
    requestAnimationFrame(tick);
  </script>
</body>
</html>
